name: Alerta devoluciones VeEX

on:
  schedule:
    # Lunes a viernes, cada 30 min, 08:00-19:30 hora Argentina (UTC-3 = 11-22 UTC)
    - cron: "*/30 11-22 * * 1-5"
  workflow_dispatch: {}

jobs:
  alerta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python alerta_veex.py
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
