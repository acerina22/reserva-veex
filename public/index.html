<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserva VeEX</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mut:#667085; --line:#e4e7ec;
          --ok:#127a43; --okbg:#e6f6ee; --warn:#a15c00; --warnbg:#fff3df; --bad:#b42318; --badbg:#fde8e6; --pri:#2354d6; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 20px; background:#14213d; color:#fff; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:#c8d1e6; font-size:13px; }
  main { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .equipos { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 8px; font-size:17px; }
  .badge { display:inline-block; padding:3px 10px; border-radius:99px; font-weight:600; font-size:13px; }
  .libre { background:var(--okbg); color:var(--ok); }
  .retirado { background:var(--warnbg); color:var(--warn); }
  .vencido { background:var(--badbg); color:var(--bad); }
  .reservado { background:#e8eefc; color:var(--pri); }
  .meta { color:var(--mut); font-size:13px; margin-top:8px; }
  ul { list-style:none; padding:0; margin:10px 0 0; display:grid; gap:8px; }
  li { border:1px solid var(--line); border-radius:8px; padding:10px; }
  li .top { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-weight:600; }
  li .acc { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; }
  button.p { background:var(--pri); border-color:var(--pri); color:#fff; font-weight:600; }
  button:hover { filter:brightness(.96); }
  form { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  label { display:grid; gap:4px; font-size:13px; color:var(--mut); }
  input, select, textarea { font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:#fff; }
  .full { grid-column:1/-1; }
  #msg { padding:10px 12px; border-radius:8px; display:none; }
  #msg.e { display:block; background:var(--badbg); color:var(--bad); }
  #msg.o { display:block; background:var(--okbg); color:var(--ok); }
  .regla { font-size:13px; color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>Reserva VeEX</h1>
  <p>Revisá acá la disponibilidad antes de usar un equipo. Si no está cargado, no está reservado.</p>
</header>
<main>
  <div id="msg" role="status"></div>
  <section class="equipos" id="equipos"></section>

  <section class="card">
    <h2>Nueva reserva</h2>
    <form id="f">
      <label>Equipo
        <select name="equipo" required><option>VeEX 10G</option><option>VeEX 1G</option></select>
      </label>
      <label>Desde <input type="datetime-local" name="desde" required></label>
      <label>Hasta <input type="datetime-local" name="hasta" required></label>
      <label>Sector
        <select name="sector"><option>PE</option><option>NOC</option><option>Otro</option></select>
      </label>
      <label>Cliente / Caso <input name="cliente_caso" placeholder="Cliente X / 00012345 o #canal-del-caso" maxlength="300"></label>
      <label>Ubicación / Sede <input name="ubicacion" maxlength="300"></label>
      <label>Responsable <input name="responsable" required maxlength="80" placeholder="Tu nombre"></label>
      <label class="full">Observación <textarea name="observacion" rows="2" maxlength="1000" placeholder="Accesorios, fallas, condiciones"></textarea></label>
      <div class="full"><button class="p" type="submit">Reservar</button></div>
    </form>
    <p class="regla">Si el horario choca con otra reserva del mismo equipo, el sistema no te deja guardar. Al retirar el equipo tocá <b>Retirar</b>; al devolverlo, <b>Devolver</b>.</p>
  </section>
</main>

<script>
const TZ = "America/Argentina/Buenos_Aires";
const EQUIPOS = ["VeEX 10G", "VeEX 1G"];
const fmt = (iso) => new Date(iso).toLocaleString("es-AR", { timeZone: TZ, day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let ahora = new Date();

function msg(texto, tipo) {
  const m = document.getElementById("msg");
  m.className = tipo; m.textContent = texto;
  if (tipo === "o") setTimeout(() => { m.className = ""; }, 4000);
}

async function pedir(url, opts) {
  const r = await fetch(url, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Error");
  return d;
}

async function accion(id, estado) {
  try { await pedir(`/api/reservas/${id}/estado`, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ estado }) }); cargar(); }
  catch (e) { msg(e.message, "e"); cargar(); }
}

function itemReserva(r) {
  const li = el("li");
  const top = el("div", "top");
  top.append(el("span", null, `${fmt(r.desde)} – ${fmt(r.hasta)}`), el("span", null, r.responsable));
  li.append(top, el("div", "meta", [r.sector, r.cliente_caso, r.ubicacion].filter(Boolean).join(" · ")));
  if (r.observacion) li.append(el("div", "meta", r.observacion));
  const acc = el("div", "acc");
  if (r.estado === "reservado") {
    const b1 = el("button", "p", "Retirar"); b1.onclick = () => accion(r.id, "retirado");
    const b2 = el("button", null, "Cancelar"); b2.onclick = () => { if (confirm("¿Cancelar esta reserva?")) accion(r.id, "cancelado"); };
    acc.append(b1, b2);
  } else if (r.estado === "retirado") {
    const b = el("button", "p", "Devolver"); b.onclick = () => accion(r.id, "devuelto");
    acc.append(b);
  }
  li.append(acc);
  return li;
}

function pintar(reservas) {
  const cont = document.getElementById("equipos");
  cont.replaceChildren();
  for (const eq of EQUIPOS) {
    const card = el("div", "card");
    card.append(el("h2", null, eq));
    const activas = reservas.filter(r => r.equipo === eq && (r.estado === "reservado" || r.estado === "retirado"));
    const retirada = activas.find(r => r.estado === "retirado");
    if (retirada) {
      const vencida = new Date(retirada.hasta) < ahora;
      card.append(el("span", "badge " + (vencida ? "vencido" : "retirado"),
        vencida ? "Retirado · devolución vencida" : "Retirado 🔄"));
      card.append(el("div", "meta", `Lo tiene ${retirada.responsable} (${retirada.sector || "-"}) hasta ${fmt(retirada.hasta)}`));
    } else {
      card.append(el("span", "badge libre", "Disponible ✅"));
    }
    const lista = el("ul");
    if (!activas.length) card.append(el("div", "meta", "Sin reservas pendientes."));
    activas.forEach(r => lista.append(itemReserva(r)));
    card.append(lista);
    cont.append(card);
  }
}

async function cargar() {
  try {
    const d = await pedir("/api/reservas");
    ahora = new Date(d.ahora);
    pintar(d.reservas);
  } catch (e) { msg("No se pudo cargar: " + e.message, "e"); }
}

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target, v = Object.fromEntries(new FormData(f));
  v.desde = new Date(v.desde).toISOString();
  v.hasta = new Date(v.hasta).toISOString();
  try {
    await pedir("/api/reservas", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(v) });
    msg("Reserva guardada ✅", "o");
    f.observacion.value = ""; f.cliente_caso.value = ""; f.ubicacion.value = "";
    cargar();
  } catch (e) { msg(e.message, "e"); }
});

cargar();
setInterval(cargar, 60000);
</script>
</body>
</html>
