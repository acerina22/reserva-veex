<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>VeEX // reservas</title>
<style>
  :root {
    --bg:#040807; --panel:rgba(6,16,13,.88); --line:#12382c; --line2:#1d5a45;
    --ink:#d4ffee; --mut:#7fb39c; --g:#00ff9c; --g2:#00c97a;
    --cy:#38e1ff; --am:#ffb020; --rd:#ff4d6d;
    --mono: ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  body { margin:0; font:15px/1.5 var(--mono); background:var(--bg); color:var(--ink); min-height:100vh; }
  #rain { position:fixed; inset:0; width:100%; height:100%; z-index:0; opacity:.22; pointer-events:none; }
  .wrap { position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:20px 16px 48px; display:grid; gap:18px; }
  header { padding:8px 2px 0; }
  header h1 { margin:0; font-size:clamp(22px,4vw,30px); letter-spacing:.04em; color:var(--g); text-shadow:0 0 14px rgba(0,255,156,.45); }
  header h1 .cur { display:inline-block; width:.6ch; height:1em; background:var(--g); margin-left:6px; vertical-align:-2px; animation:blink 1.1s steps(1) infinite; }
  header p { margin:6px 0 0; color:var(--mut); font-size:13px; }
  header p::before { content:"> "; color:var(--g2); }
  .reloj { margin-top:8px; font-size:12px; color:var(--mut); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:18px; backdrop-filter:blur(3px);
           box-shadow:0 0 0 1px rgba(0,255,156,.03), 0 8px 30px rgba(0,0,0,.5); position:relative; }
  .panel::before { content:""; position:absolute; left:-1px; top:-1px; width:16px; height:16px; border-top:2px solid var(--g); border-left:2px solid var(--g); border-radius:6px 0 0 0; }
  .panel::after { content:""; position:absolute; right:-1px; bottom:-1px; width:16px; height:16px; border-bottom:2px solid var(--g); border-right:2px solid var(--g); border-radius:0 0 6px 0; }
  h2 { margin:0 0 10px; font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--g); font-weight:700; }
  .equipos { display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:18px; }
  .st { display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; }
  .dot { width:11px; height:11px; border-radius:50%; background:currentColor; box-shadow:0 0 10px currentColor; flex:none; }
  .libre { color:var(--g); } .retirado { color:var(--am); } .vencido { color:var(--rd); } .reservado { color:var(--cy); }
  .vencido .dot { animation:pulse 1s ease-in-out infinite; }
  .meta { color:var(--mut); font-size:13px; margin-top:6px; word-break:break-word; }
  .meta b { color:var(--ink); font-weight:600; }
  ul { list-style:none; padding:0; margin:14px 0 0; display:grid; gap:10px; }
  li { border:1px solid var(--line); border-left:3px solid var(--cy); border-radius:4px; padding:10px 12px; background:rgba(0,0,0,.25); }
  li.ret { border-left-color:var(--am); }
  li .top { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-weight:600; }
  li .tag { font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
  li .acc { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; font-size:13px; color:var(--ink); background:transparent; border:1px solid var(--line2); border-radius:4px; padding:7px 14px; cursor:pointer; letter-spacing:.04em; min-height:36px; }
  button:hover { border-color:var(--g); color:var(--g); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--g); outline-offset:2px; }
  button.p { background:var(--g); border-color:var(--g); color:#02140c; font-weight:700; }
  button.p:hover { background:#5dffbf; color:#02140c; box-shadow:0 0 16px rgba(0,255,156,.5); }
  button:disabled { opacity:.5; cursor:wait; }
  form { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
  label { display:grid; gap:5px; font-size:12px; color:var(--mut); letter-spacing:.08em; text-transform:uppercase; }
  input, select, textarea { font:inherit; font-size:14px; letter-spacing:0; text-transform:none; padding:9px 10px; color:var(--ink);
           background:#02100b; border:1px solid var(--line2); border-radius:4px; }
  input::placeholder, textarea::placeholder { color:#4f7a68; }
  input[type=datetime-local] { color-scheme:dark; }
  .full { grid-column:1/-1; }
  #msg { display:none; padding:10px 14px; border-radius:4px; border:1px solid; font-size:14px; }
  #msg.e { display:block; color:var(--rd); border-color:var(--rd); background:rgba(255,77,109,.08); }
  #msg.o { display:block; color:var(--g); border-color:var(--g2); background:rgba(0,255,156,.07); }
  .regla { font-size:12px; color:var(--mut); margin:14px 0 0; }
  .regla b { color:var(--g); }
  @keyframes blink { 50% { opacity:0; } }
  @keyframes pulse { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { header h1 .cur, .vencido .dot { animation:none; } #rain { display:none; } }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1>VEEX//RESERVAS<span class="cur"></span></h1>
    <p>Revisá la disponibilidad antes de usar un equipo. Si no está cargado, no está reservado.</p>
    <div class="reloj" id="reloj"></div>
  </header>

  <div id="msg" role="status" aria-live="polite"></div>
  <section class="equipos" id="equipos" aria-label="Estado de equipos"></section>

  <section class="panel">
    <h2>Nueva reserva</h2>
    <form id="f">
      <label>Equipo
        <select name="equipo" required><option>VeEX 10G</option><option>VeEX 1G</option></select>
      </label>
      <label>Desde <input type="datetime-local" name="desde" required></label>
      <label>Hasta <input type="datetime-local" name="hasta" required></label>
      <label>Sector
        <select name="sector"><option>PE</option><option>NOC</option><option>Otro</option></select>
      </label>
      <label>Cliente / Caso <input name="cliente_caso" placeholder="Cliente X / 00012345 o #canal-del-caso" maxlength="300"></label>
      <label>Ubicación / Sede <input name="ubicacion" maxlength="300"></label>
      <label>Responsable <input name="responsable" required maxlength="80" placeholder="Tu nombre" autocomplete="name"></label>
      <label class="full">Observación <textarea name="observacion" rows="2" maxlength="1000" placeholder="Accesorios, fallas, condiciones del equipo"></textarea></label>
      <div class="full"><button class="p" type="submit" id="go">Reservar</button></div>
    </form>
    <p class="regla">Si el horario choca con otra reserva del mismo equipo, <b>el sistema no te deja guardar</b>. Al retirar el equipo tocá <b>Retirar</b>; al devolverlo, <b>Devolver</b>.</p>
  </section>
</div>

<script>
const TZ = "America/Argentina/Buenos_Aires";
const EQUIPOS = ["VeEX 10G", "VeEX 1G"];
const fmt = (iso) => new Date(iso).toLocaleString("es-AR", { timeZone: TZ, day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let ahora = new Date(), reservas = [];

function quedan(hasta) {
  const ms = new Date(hasta) - ahora, a = Math.abs(ms);
  const h = Math.floor(a / 3600000), m = Math.floor((a % 3600000) / 60000);
  const t = h >= 24 ? `${Math.floor(h / 24)}d ${h % 24}h` : `${h}h ${String(m).padStart(2, "0")}m`;
  return ms >= 0 ? `quedan ${t}` : `vencido hace ${t}`;
}

function msg(texto, tipo) {
  const m = document.getElementById("msg");
  m.className = tipo; m.textContent = (tipo === "e" ? "[ERROR] " : "[OK] ") + texto;
  if (tipo === "o") setTimeout(() => { m.className = ""; m.textContent = ""; }, 4000);
}

async function pedir(url, opts) {
  const r = await fetch(url, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Error");
  return d;
}

async function accion(id, estado) {
  try { await pedir(`/api/reservas/${id}/estado`, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ estado }) }); }
  catch (e) { msg(e.message, "e"); }
  cargar();
}

function itemReserva(r) {
  const li = el("li", r.estado === "retirado" ? "ret" : "");
  const top = el("div", "top");
  top.append(el("span", null, `${fmt(r.desde)} → ${fmt(r.hasta)}`), el("span", "tag " + r.estado, r.estado));
  li.append(top);
  li.append(el("div", "meta", "👤 " + r.responsable));
  const det = [r.sector, r.cliente_caso, r.ubicacion].filter(Boolean).join(" · ");
  if (det) li.append(el("div", "meta", det));
  if (r.observacion) li.append(el("div", "meta", "// " + r.observacion));
  const acc = el("div", "acc");
  if (r.estado === "reservado") {
    const b1 = el("button", "p", "Retirar"); b1.onclick = () => accion(r.id, "retirado");
    const b2 = el("button", null, "Cancelar"); b2.onclick = () => { if (confirm("¿Cancelar esta reserva?")) accion(r.id, "cancelado"); };
    acc.append(b1, b2);
  } else if (r.estado === "retirado") {
    const b = el("button", "p", "Devolver"); b.onclick = () => accion(r.id, "devuelto");
    acc.append(b);
  }
  li.append(acc);
  return li;
}

function pintar() {
  const cont = document.getElementById("equipos");
  cont.replaceChildren();
  for (const eq of EQUIPOS) {
    const card = el("div", "panel");
    card.append(el("h2", null, eq));
    const activas = reservas.filter(r => r.equipo === eq && (r.estado === "reservado" || r.estado === "retirado"));
    const retirada = activas.find(r => r.estado === "retirado");
    const st = el("div", "st");
    if (retirada) {
      const vencida = new Date(retirada.hasta) < ahora;
      st.classList.add(vencida ? "vencido" : "retirado");
      st.append(el("span", "dot"), el("span", null, vencida ? "RETIRADO · DEVOLUCIÓN VENCIDA" : "RETIRADO"));
      card.append(st);
      const m = el("div", "meta");
      m.append(document.createTextNode("Lo tiene "), Object.assign(el("b"), { textContent: retirada.responsable }),
               document.createTextNode(` (${retirada.sector || "-"}) · hasta ${fmt(retirada.hasta)} · ${quedan(retirada.hasta)}`));
      card.append(m);
    } else {
      st.classList.add("libre");
      st.append(el("span", "dot"), el("span", null, "DISPONIBLE"));
      card.append(st);
      const prox = activas.find(r => r.estado === "reservado");
      card.append(el("div", "meta", prox ? `Próxima reserva: ${fmt(prox.desde)}` : "Sin reservas pendientes."));
    }
    const lista = el("ul");
    activas.forEach(r => lista.append(itemReserva(r)));
    card.append(lista);
    cont.append(card);
  }
}

async function cargar() {
  try {
    const d = await pedir("/api/reservas");
    ahora = new Date(d.ahora); reservas = d.reservas;
    pintar();
  } catch (e) { msg("No se pudo cargar: " + e.message, "e"); }
}

// fechas por defecto: ahora (redondeado a 15 min) y +2 h
function local(d) { const p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function fechasPorDefecto() {
  const f = document.getElementById("f"), d = new Date();
  d.setMinutes(Math.ceil(d.getMinutes() / 15) * 15, 0, 0);
  f.desde.value = local(d); f.hasta.value = local(new Date(d.getTime() + 2 * 3600000));
}
// recordar el nombre en este navegador
try { const n = localStorage.getItem("veex_resp"); if (n) document.getElementById("f").responsable.value = n; } catch (_) {}

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target, go = document.getElementById("go"), v = Object.fromEntries(new FormData(f));
  v.desde = new Date(v.desde).toISOString(); v.hasta = new Date(v.hasta).toISOString();
  go.disabled = true;
  try {
    await pedir("/api/reservas", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(v) });
    try { localStorage.setItem("veex_resp", v.responsable); } catch (_) {}
    msg("Reserva guardada.", "o");
    f.observacion.value = ""; f.cliente_caso.value = ""; f.ubicacion.value = "";
    fechasPorDefecto(); cargar();
  } catch (e) { msg(e.message, "e"); }
  go.disabled = false;
});

function reloj() {
  document.getElementById("reloj").textContent = "SYS.TIME " + new Date().toLocaleString("es-AR", { timeZone: TZ, dateStyle:"short", timeStyle:"medium", hour12:false }) + " ART";
}

// lluvia de código (decorativa, baja opacidad)
(function () {
  const c = document.getElementById("rain");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const x = c.getContext("2d"), glyphs = "01アイウエオカキクケコサシスセソタチツテト<>/{}[]=+*", size = 16;
  let cols, drops;
  function size_() { c.width = innerWidth; c.height = innerHeight; cols = Math.ceil(c.width / size); drops = Array.from({ length: cols }, () => Math.random() * -50); }
  addEventListener("resize", size_); size_();
  setInterval(() => {
    x.fillStyle = "rgba(4,8,7,.12)"; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = "#00ff9c"; x.font = size + "px monospace";
    drops.forEach((y, i) => {
      x.fillText(glyphs[Math.floor(Math.random() * glyphs.length)], i * size, y * size);
      drops[i] = y * size > c.height && Math.random() > .975 ? 0 : y + 1;
    });
  }, 70);
})();

fechasPorDefecto(); reloj(); cargar();
setInterval(reloj, 1000);
setInterval(cargar, 60000);
</script>
</body>
</html>
